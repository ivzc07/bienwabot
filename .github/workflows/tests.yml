name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Test
        run: pytest -q

      # The container is part of the deliverable, so the one required check
      # covers it too: it must build, boot, and refuse to boot half-configured.
      - name: Build the container image
        run: docker build -t rebe-agent:ci .
      - name: Write a throwaway environment
        run: |
          cat > .env.ci <<'EOF'
          DEEPSEEK_API_KEY=ci-not-a-real-key
          EVOLUTION_API_URL=http://bien-evo-api:8080
          EVOLUTION_API_KEY=ci-not-a-real-key
          WEBHOOK_SECRET=ci-not-a-real-secret
          REBE_DATABASE_URL=postgresql://rebe:ci@bien-evo-pg:5432/rebe
          TELEGRAM_BOT_TOKEN=ci-not-a-real-token
          TELEGRAM_CHAT_ID=-1000000000000
          KUMA_PUSH_URL=http://kuma:3001/api/push/ci
          EOF
      - name: Boot with a complete environment
        run: |
          docker run --rm --env-file .env.ci rebe-agent:ci --check-config 2>&1 | tee boot.log
          grep -q "evolution_instance=bien-rebe" boot.log
          grep -q "timezone=America/Mexico_City" boot.log
      - name: Refuse to boot with a required variable missing
        run: |
          grep -v '^DEEPSEEK_API_KEY=' .env.ci > .env.broken
          if docker run --rm --env-file .env.broken rebe-agent:ci --check-config > broken.log 2>&1; then
            echo "expected a non-zero exit when DEEPSEEK_API_KEY is missing"
            cat broken.log
            exit 1
          fi
          grep -q "DEEPSEEK_API_KEY" broken.log
