name: tests

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    # -o pipefail so a failure on the left of a pipe fails the step.
    shell: bash -euo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-latest

    # The call counters and the token totals live in Postgres, and "survives a
    # restart" is only worth asserting against a real one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: rebe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REBE_TEST_DATABASE_URL: postgresql://postgres:rebe@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: mypy
      - name: Test
        # The database tests skip when REBE_TEST_DATABASE_URL is unset, and a
        # gate that silently skips is worse than no gate - so fail first if the
        # service wiring above ever goes missing.
        run: |
          test -n "$REBE_TEST_DATABASE_URL"
          pytest -q -rs

      # The container is part of the deliverable, so the one required check
      # covers it too: it must build, boot, stay up, and refuse to start
      # half-configured.
      - name: Build the container image
        run: docker build -t rebe-agent:ci .
      - name: Write a throwaway environment
        # Generated from .env.example so the variable list has one home. Blank
        # values there are secrets; any placeholder does for a config check.
        run: |
          grep -E '^[A-Z][A-Z0-9_]*=' .env.example \
            | sed -e 's/^\([A-Z][A-Z0-9_]*\)=$/\1=ci-placeholder/' \
                  -e 's/CHANGE_ME/ci-placeholder/' \
            > .env.ci
          cat .env.ci
      - name: Boot with a complete environment
        run: |
          docker run --rm --env-file .env.ci rebe-agent:ci --check-config > boot.log 2>&1
          cat boot.log
          grep -q 'evolution_instance=bien-rebe' boot.log
          grep -q 'timezone=America/Mexico_City' boot.log
      - name: Stay up, then stop cleanly on SIGTERM
        # The wait is longer than the container needs on a healthy deployment: with
        # no `rebe` database reachable here, boot spends a few seconds failing to
        # read the soft-pause switch before the ops channel comes up - which it
        # must do anyway, because an unreachable database is exactly when a
        # maintainer needs to be told something.
        run: |
          id=$(docker run -d --env-file .env.ci rebe-agent:ci)
          sleep 10
          test "$(docker inspect -f '{{.State.Running}}' "$id")" = "true"
          docker stop -t 15 "$id" > /dev/null
          # Read the log once, into a file. `docker logs | grep -q` reads like the
          # obvious thing and is a race: grep exits at its first match, the pipe
          # closes under docker, docker dies of SIGPIPE, and `pipefail` turns that
          # into a failed step with exit 141. It gets likelier the more the
          # container logged, so it fires on a bad day and passes on a good one.
          docker logs "$id" > container.log 2>&1
          cat container.log
          # All three of them, in one process: the webhook leg serving, the
          # scheduler turning, and the ops channel listening. One image that
          # boots two of the three is the failure this step exists to catch.
          grep -q 'serving the webhook leg on port 8000' container.log
          grep -q 'scheduler leg up' container.log
          grep -q 'ops control channel is listening' container.log
          # Both the Telegram bot token and the Kuma push token live in a URL
          # *path*, so any logged line carrying one is a leaked credential - and
          # httpx logs the URL of every request it makes at INFO by default.
          if grep -Eq 'api\.telegram\.org/bot.|/api/push/' container.log; then
            echo "a token-bearing URL reached the log"
            exit 1
          fi
          test "$(docker inspect -f '{{.State.ExitCode}}' "$id")" = "0"
          docker rm "$id" > /dev/null
      - name: Local time follows TZ
        # Proves the value flows env -> settings -> clock, rather than the image
        # baking one timezone in: an override has to change the logged offset.
        run: |
          docker run --rm --env-file .env.ci rebe-agent:ci --check-config > default_tz.log 2>&1
          grep -q 'local_time=.*-06:00' default_tz.log
          docker run --rm --env-file .env.ci -e TZ=UTC rebe-agent:ci --check-config > utc.log 2>&1
          grep -q 'timezone=UTC' utc.log
          grep -q 'local_time=.*+00:00' utc.log
          # And the process's own local time, not just the agent's clock.
          docker run --rm --env-file .env.ci --entrypoint python rebe-agent:ci \
            -c 'import time; print("os_local", time.strftime("%z"))' | grep -q 'os_local -0600'
      - name: The brain's dependencies are in the image, not just in CI's venv
        run: |
          docker run --rm --env-file .env.ci --entrypoint python rebe-agent:ci \
            -c 'import rebe_agent.brain as b; print("model", b.DEEPSEEK_MODEL)' \
            | grep -q 'model deepseek-v4-flash'

      # Same for the send path: the pacer is what every message leaves through,
      # so an image that cannot import it is an image that cannot post.
      - name: The pacer is in the image, with the shipped envelope
        run: |
          docker run --rm --env-file .env.ci --entrypoint python rebe-agent:ci \
            -c 'from rebe_agent.pacer import Envelope; e = Envelope(); print("envelope", e.sends_per_minute, e.sends_per_hour, e.sends_per_day)' \
            | grep -q 'envelope 4 3 12'
          docker run --rm --env-file .env.ci rebe-agent:ci --help | grep -q -- '--say'

      # And the news leg: its sources are a list in the image, not a config file,
      # so an image that lost them would fetch nothing and post nothing quietly.
      - name: The news leg is in the image, with its verified source set
        run: |
          docker run --rm --env-file .env.ci --entrypoint python rebe-agent:ci \
            -c 'from rebe_agent.feeds import FEEDS; print("feeds", len(FEEDS), sorted(f.key for f in FEEDS)[0])' \
            | grep -q 'feeds 8 deepmind'
          docker run --rm --env-file .env.ci rebe-agent:ci --help | grep -q -- '--post-news'
      # And the ops channel: it is the only thing that tells a human anything, so
      # an image that lost it would fail silently by definition.
      - name: The ops channel is in the image, with its heartbeat and its commands
        run: |
          docker run --rm --env-file .env.ci --entrypoint python rebe-agent:ci \
            -c 'from rebe_agent.heartbeat import HEARTBEAT_SECONDS; from rebe_agent.ops import PAUSE_COMMANDS, RESUME_COMMANDS; print("ops", int(HEARTBEAT_SECONDS), sorted(PAUSE_COMMANDS)[0], sorted(RESUME_COMMANDS)[0])' \
            | grep -q 'ops 60 pausa reanuda'

      # And the webhook leg, which is what the container serves when it starts.
      # The port is published to loopback for this step only: in production the
      # agent has no published port and no public FQDN, and Evolution reaches it
      # by container name over the internal network.
      - name: The webhook leg serves, and only with the token
        run: |
          id=$(docker run -d -p 127.0.0.1:8000:8000 --env-file .env.ci rebe-agent:ci)
          # Any HTTP answer means it is listening; -f is deliberately absent
          # because the answer to this probe is a 405 and that is still "up".
          for _ in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/webhook/nope && break || sleep 1
          done
          code() { curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{}' "$1"; }
          test "$(code http://127.0.0.1:8000/webhook/nope)" = "404"
          test "$(code http://127.0.0.1:8000/webhook/ci-placeholder)" = "200"
          docker logs "$id"
          docker rm -f "$id" > /dev/null
      - name: Refuse to boot with a required variable missing
        run: |
          grep -v '^DEEPSEEK_API_KEY=' .env.ci > .env.broken
          if docker run --rm --env-file .env.broken rebe-agent:ci --check-config > broken.log 2>&1; then
            echo "expected a non-zero exit when DEEPSEEK_API_KEY is missing"
            cat broken.log
            exit 1
          fi
          cat broken.log
          grep -q 'DEEPSEEK_API_KEY' broken.log
